version: '3.9'

services:

    mongodb:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            - breezy-network
    
    backend:
        build: ./backend
        ports:
            - "3000:3000"
        env_file:
            - ./backend/.env
        depends_on:
            - mongodb
        networks:
            - breezy-network
        
    frontend:
        build: ./frontend
        ports:
            - "3005:3000"
        env_file:
            - ./frontend/.env
        depends_on:
            - backend
        networks:
            - breezy-network

volumes:
    mongo_data:

networks:
    breezy-network:
        driver: bridge