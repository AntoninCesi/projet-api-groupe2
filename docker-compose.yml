services:

    mongodb:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            - breezy-network
    
    backend:
        build: ./backend
        ports:
            - "3000:3000"
        env_file:
            - ./backend/.env
        environment:
            # Dans le réseau Docker, le backend joint Mongo via le nom du service,
            # pas "localhost". Cet override prime sur la valeur du .env.
            - MONGO_HOST=mongodb
            # Pré-remplit la base au démarrage si elle est vide (jeu de démo).
            - SEED_ON_START=true
        depends_on:
            - mongodb
        networks:
            - breezy-network

    frontend:
        build:
            context: ./frontend
            args:
                # NEXT_PUBLIC_API_URL est injecté au build (bundle navigateur).
                # Le navigateur appelle l'API via le reverse proxy HTTPS (Caddy),
                # sur le même origine -> pas de mixed-content, un seul certificat.
                NEXT_PUBLIC_API_URL: https://localhost/api-proxy
        environment:
            # URL serveur->serveur (SSR dans le conteneur) : passe par le réseau Docker.
            - INTERNAL_API_URL=http://backend:3000
        ports:
            - "3005:3000"
        depends_on:
            - backend
        networks:
            - breezy-network

    caddy:
        image: caddy:2-alpine
        ports:
            - "80:80"     # redirige automatiquement vers HTTPS
            - "443:443"   # point d'entrée HTTPS
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data      # certificats persistés entre redémarrages
            - caddy_config:/config
        depends_on:
            - frontend
            - backend
        networks:
            - breezy-network

volumes:
    mongo_data:
    caddy_data:
    caddy_config:

networks:
    breezy-network:
        driver: bridge